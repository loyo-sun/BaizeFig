# Example only: replace domain, root and certificate paths for your deployment.
# Node MCP stays on loopback; expose only the TLS reverse proxy.
server {
    listen 443 ssl;
    server_name design.example.com;
    ssl_certificate /etc/letsencrypt/live/design.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/design.example.com/privkey.pem;
    root /srv/baizefig/dist;
    index index.html;
    client_max_body_size 1m;

    location = /mcp {
        proxy_pass http://127.0.0.1:4319;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 45s;
    }
    location = /bridge {
        proxy_pass http://127.0.0.1:4319;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Preserve Origin: the Node service verifies its exact allowlist.
        proxy_read_timeout 3600s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 80;
    server_name design.example.com;
    return 301 https://$host$request_uri;
}

name: Apple Silicon release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if (process.env.GITHUB_REF_NAME !== require('./package.json').displayVersion) process.exit(1)"
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run test:desktop:ui
      - name: Build unsigned Apple Silicon package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package-mac.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: BaizeFig-mac-arm64
          path: |
            desktop-release/*-mac-arm64.dmg
            desktop-release/*-mac-arm64.zip
          if-no-files-found: error
      - name: Publish Apple Silicon release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').displayVersion")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; keeping its published assets."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "desktop-release/BaizeFig-$VERSION-mac-arm64.dmg" "desktop-release/BaizeFig-$VERSION-mac-arm64.zip" --verify-tag --title "BaizeFig $GITHUB_REF_NAME — Apple Silicon" --notes-file docs/DESKTOP_RELEASE.md --prerelease

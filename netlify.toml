[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
  BAIZEFIG_SKIP_DESKTOP_DOWNLOAD = "1"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

appId: com.loyo.baizefig
productName: BaizeFig
icon: desktop/icon.png
electronDist: node_modules/electron/dist
directories:
  output: desktop-release
files:
  - dist/**/*
  - desktop/**/*
  - bridge/**/*
  - package.json
  - "!desktop/**/*.test.*"
asar: true
afterSign: scripts/verify-mac-signature.cjs
artifactName: "${productName}-${env.BAIZEFIG_RELEASE_VERSION}-${os}-${arch}.${ext}"
fileAssociations:
  - ext: baizefig
    name: BaizeFig Design Document
    role: Editor
    mimeType: application/x-baizefig
mac:
  category: public.app-category.graphics-design
  target:
    - dmg
    - zip
  identity: "-"
  hardenedRuntime: true
  notarize: false
publish:
  provider: github
  owner: loyo-sun
  repo: BaizeFig
  releaseType: release

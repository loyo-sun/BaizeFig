<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BaizeFig 帮助中心</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fafaf9;
        color: #232825;
        font:
          15px/1.7 system-ui,
          -apple-system,
          "PingFang SC",
          sans-serif;
      }
      a {
        color: inherit;
      }
      header {
        height: 76px;
        border-bottom: 1px solid #e3e6e1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        background: white;
      }
      header a {
        text-decoration: none;
      }
      strong {
        font-size: 20px;
        letter-spacing: -0.5px;
      }
      header span {
        color: #6b746d;
        margin-left: 16px;
        font-size: 14px;
      }
      .back {
        font-size: 14px;
        color: #4d6154;
      }
      .layout {
        max-width: 1280px;
        margin: auto;
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: calc(100vh - 76px);
      }
      aside {
        padding: 32px 24px;
        border-right: 1px solid #e3e6e1;
      }
      label {
        display: block;
        font-size: 12px;
        color: #69746d;
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        border: 1px solid #dce2db;
        border-radius: 8px;
        padding: 11px;
        background: white;
        font: inherit;
        font-size: 14px;
      }
      nav {
        display: grid;
        gap: 6px;
        margin-top: 24px;
      }
      nav a {
        padding: 10px 12px;
        text-decoration: none;
        border-radius: 7px;
        color: #647067;
        font-size: 14px;
      }
      nav a:hover,
      nav a[aria-current="page"] {
        background: #e9eee8;
        color: #24492f;
      }
      main {
        padding: 54px 64px;
        max-width: 940px;
      }
      .eyebrow {
        color: #5b745e;
        font-size: 12px;
        letter-spacing: 2px;
      }
      h1 {
        font-size: 36px;
        line-height: 1.3;
        letter-spacing: -1px;
        margin: 14px 0;
      }
      p {
        color: #68716b;
      }
      .badge {
        display: inline-block;
        font-size: 12px;
        color: #6d715d;
        background: #eeeee4;
        border-radius: 5px;
        padding: 4px 9px;
      }
      .notice {
        border-left: 3px solid #9cae96;
        padding: 12px 18px;
        background: #f0f3ed;
        margin: 28px 0;
        color: #5d695e;
        font-size: 14px;
      }
      .cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 30px;
      }
      .card {
        display: block;
        background: white;
        border: 1px solid #e1e6df;
        border-radius: 12px;
        padding: 24px;
        text-decoration: none;
        transition: border-color 0.15s;
      }
      .card:hover {
        border-color: #799275;
      }
      .card small {
        color: #7f8b80;
        font-size: 12px;
      }
      .card h2 {
        font-size: 18px;
        margin: 10px 0;
      }
      .card span {
        font-size: 13px;
        color: #838b84;
      }
      .placeholder {
        padding: 48px 28px;
        border: 1px dashed #ccd6c9;
        border-radius: 12px;
        background: white;
        margin-top: 30px;
      }
      .placeholder h2 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      .placeholder p {
        margin: 0;
        font-size: 14px;
      }
      .pager {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-top: 32px;
        font-size: 14px;
      }
      .pager a {
        color: #416349;
        text-decoration: none;
      }
      footer {
        margin-top: 48px;
        border-top: 1px solid #e1e6df;
        padding-top: 20px;
        color: #939b94;
        font-size: 12px;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 760px) {
        header {
          padding: 0 20px;
        }
        header span {
          display: none;
        }
        .layout {
          grid-template-columns: 1fr;
        }
        aside {
          border-right: 0;
          border-bottom: 1px solid #e3e6e1;
          padding: 20px;
        }
        nav {
          grid-template-columns: 1fr 1fr;
          margin-top: 16px;
        }
        main {
          padding: 30px 20px;
        }
        .cards {
          grid-template-columns: 1fr;
        }
        h1 {
          font-size: 28px;
        }
      }
      main {
        min-width: 0;
        scroll-margin-top: 24px;
      }
      article {
        margin-top: 28px;
        overflow-wrap: anywhere;
      }
      article h2 {
        font-size: 22px;
        line-height: 1.5;
        margin: 36px 0 14px;
        scroll-margin-top: 24px;
      }
      article p,
      article li {
        color: #525e55;
      }
      article li {
        margin: 10px 0;
      }
      article a {
        color: #315d3d;
        text-underline-offset: 3px;
      }
      article code {
        font:
          13px/1.7 ui-monospace,
          monospace;
        background: #edf0eb;
        border-radius: 3px;
        padding: 2px 5px;
      }
      pre {
        background: #edf0eb;
        border: 1px solid #dce3d8;
        border-radius: 10px;
        padding: 20px;
        overflow-x: auto;
      }
      article pre code {
        padding: 0;
        background: transparent;
      }
      kbd {
        font:
          12px/1.7 system-ui,
          sans-serif;
        border: 1px solid #d7dfd3;
        border-radius: 4px;
        background: white;
        padding: 2px 5px;
      }
      blockquote {
        margin: 20px 0;
        padding: 16px 20px;
        border-left: 3px solid #8b9f83;
        background: #eef2eb;
        color: #425846;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        border-bottom: 1px solid #dde3d9;
        padding: 12px;
        vertical-align: top;
        min-width: 110px;
      }
      th {
        background: #eef2eb;
        color: #38513d;
      }
      #toc {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid #e1e6df;
      }
      #toc a {
        padding: 5px 9px;
        font-size: 12px;
        background: #eef2eb;
      }
      #matches {
        font-size: 12px;
      }
      .skip-link {
        position: absolute;
        left: 20px;
        top: -80px;
        padding: 10px;
        background: white;
        z-index: 2;
      }
      .skip-link:focus {
        top: 10px;
      }
      a:focus-visible,
      input:focus-visible {
        outline: 2px solid #587b55;
        outline-offset: 3px;
      }
      h1:focus,
      h2:focus {
        outline: none;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#content">跳到正文</a>
    <header>
      <a href="#overview"><strong>BaizeFig</strong><span>帮助中心</span></a
      ><a class="back" href="../">返回 BaizeFig ↗</a>
    </header>
    <div class="layout">
      <aside>
        <label for="search">搜索帮助</label
        ><input id="search" type="search" placeholder="搜索标题或正文关键词…" />
        <p id="matches" role="status" aria-live="polite"></p>
        <nav aria-label="文档章节"></nav>
        <p id="empty" hidden>未找到相关章节</p>
      </aside>
      <main id="content" tabindex="-1">
        <div class="eyebrow">BAIZEFIG GUIDE</div>
        <h1 id="title" tabindex="-1">帮助中心</h1>
        <span class="badge">使用指南</span>
        <p id="intro"></p>
        <nav id="toc" aria-label="本章目录"></nav>
        <article id="chapter"></article>
        <div id="overview">
          <div class="cards"></div>
        </div>
        <div class="pager" aria-label="章节翻页"></div>
        <footer>
          BaizeFig 帮助中心 ·
          <a
            href="https://github.com/loyo-sun/BaizeFig/issues"
            target="_blank"
            rel="noopener noreferrer"
            >反馈问题</a
          >
        </footer>
      </main>
    </div>
    <script type="module" src="./help.js"></script>
  </body>
</html>
